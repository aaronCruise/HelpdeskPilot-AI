services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    #env_file:
     # - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      target: runner
    ports:
      - "5173:80"